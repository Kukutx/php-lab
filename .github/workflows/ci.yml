name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pdo-crud:
    name: pdo-crud (PHPUnit, PHPStan, PHPCS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdo-crud
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test
      - run: composer stan
      - run: composer cs

  laravel:
    name: laravel (tests, Pint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
      - run: vendor/bin/pint --test

  drupal10:
    name: drupal10 (Drupal coding standards)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drupal10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpcs --config-set installed_paths vendor/drupal/coder/coder_sniffer,vendor/sirbrillig/phpcs-variable-analysis,vendor/slevomat/coding-standard
      - run: vendor/bin/phpcs

  wordpress:
    name: wordpress (WordPress coding standards)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wordpress
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpcs
