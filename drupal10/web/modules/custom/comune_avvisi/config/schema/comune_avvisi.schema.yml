# The schema tells Drupal the type of each config value (needed for
# translation, validation and config import).
comune_avvisi.settings:
  type: config_object
  label: 'Comune Avvisi settings'
  mapping:
    highlighted_limit:
      type: integer
      label: 'Number of highlighted notices'
    expiring_days:
      type: integer
      label: 'Expiring soon window in days'
